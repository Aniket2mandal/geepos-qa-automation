name: Daily Playwright Tests

on:
  # Triggered by cron-job.org (daily 9:00 AM Nepal time) or the "Run workflow" button
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          TEST_PHONE: ${{ secrets.TEST_PHONE }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}

      - name: Save test reports and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Check secret lengths
        if: failure()
        run: |
          echo "Username length: ${#MAIL_USERNAME}"
          echo "Password length: ${#MAIL_PASSWORD}"
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}

      - name: Email team on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "FAILED: Daily Playwright Tests (${{ github.repository }})"
          to: ${{ secrets.MAIL_TO }}
          from: Playwright Alerts <${{ secrets.MAIL_USERNAME }}>
          nodemailerlog: true
          nodemailerdebug: true
          body: |
            The daily Playwright tests failed.

            Run details and report:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}